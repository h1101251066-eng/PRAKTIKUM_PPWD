<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Portofolio Saya</title>
    <link rel="stylesheet" href="css/main.css">
</head>

<body>

    <!-- Navigasi -->
    <nav>
        <div class="container">

            <div class="logo">MyPortofolio</div>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>

            <button id="dark-mode-btn">🌙</button>

        </div>
    </nav>


    <!-- Contact Section -->
    <section class="hero">

        <div class="container">

            <div class="hero-content">

                <h1>Hubungi Saya</h1>

                <p>
                    Silakan isi form di bawah ini untuk menghubungi saya.
                </p>

                <br>

                <form id="contact-form">

                    <input
                        type="text"
                        id="nama"
                        placeholder="Nama"
                        required
                    >

                    <br><br>

                    <input
                        type="email"
                        id="email"
                        placeholder="Email"
                        required
                    >

                    <br><br>

                    <textarea
                        id="pesan"
                        placeholder="Pesan"
                        rows="5"
                        required
                    ></textarea>

                    <br><br>

                    <button type="submit" class="btn">
                        Kirim Pesan
                    </button>

                </form>

            </div>

        </div>

    </section>


    <!-- Footer -->
    <footer>

        <p>&copy; 2026 MyPortofolio</p>

    </footer>


    <script src="js/main.js"></script>

</body>

</html>
