<!DOCTYPE html>
<html>
<head>
    <title>Konversi Nilai Mahasiswa</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
            background: #f0f8ff;
        }

        .konversi {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            text-align: center;
        }

        input {
            padding: 10px;
            margin: 5px;
            font-size: 16px;
            width: 80%;
            box-sizing: border-box;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            font-size: 16px;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .btn-konversi {
            background: #F9E79F;
        }

        .btn-konversi:hover {
            background: #F7DC6F;
        }

        .btn-reset {
            background: #FF8AE0;
        }

        .hasil {
            font-size: 28px;
            font-weight: bold;
            color: #2c3e50;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="konversi">
        <h2>Konversi Nilai Mahasiswa</h2>

        <input type="number" id="nilai" min="0" max="100" placeholder="Masukkan Nilai 0-100">
        <br>

        <button class="btn-konversi" onclick="konversiNilai()">Konversi</button>
        <button class="btn-reset" onclick="reset()">Reset</button>

        <div class="hasil">
            Grade: <span id="hasilNilai">-</span>
        </div>
    </div>

    <script>
        function konversiNilai() {
            let nilai = parseFloat(document.getElementById('nilai').value);
            let grade;

            if (nilai >= 90 && nilai <= 100) {
                grade = "A";
            } else if (nilai >= 80 && nilai <= 89) {
                grade = "B";
            } else if (nilai >= 70 && nilai <= 79) {
                grade = "C";
            } else if (nilai >= 60 && nilai <= 69) {
                grade = "D";
            } else if (nilai >= 0 && nilai < 60) {
                grade = "E";
            } else {
                grade = "Nilai tidak valid";
            }

            document.getElementById('hasilNilai').innerHTML = grade;
        }

        function reset() {
            document.getElementById('nilai').value = "";
            document.getElementById('hasilNilai').innerHTML = "-";
        }
    </script>

</body>
</html>
