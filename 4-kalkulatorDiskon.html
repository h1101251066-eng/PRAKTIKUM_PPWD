<!DOCTYPE html>
<html>
<head>
    <title>Kalkulator Sederhana</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 400px; margin: 50px auto; padding: 20px; background: #f0f8ff; }
        .kalkulator { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); text-align: center; }
         input { padding: 10px; margin: 5px; font-size: 16px; width: 80%; box-sizing: border-box; }
         button { padding: 10px 15px; margin: 5px; font-size: 16px; background: #F7D24F; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #fffb87; }
         .hasil { font-size: 28px; font-weight: bold; color: #2c3e50; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="kalkulator">
        <h2>Kalkulator</h2>

        <input type="number" id="angka1" placeholder="Masukkan Angka Pertama"><br>
        <input type="number" id="angka2" placeholder="Masukkan Angka Kedua"><br>

        <button onclick="tambah()">+</button>
        <button onclick="kurang()">-</button>
        <button onclick="kali()">x</button>
        <button onclick="bagi()">÷</button>
        <button onclick="reset()" style="background: #FF8AE0;">Reset</button>

        <div class="hasil">Hasil: <span id="hasilAngka">0</span></div>

        <hr style="margin: 25px 0; border: 0; border-top: 1px solid #ddd;">
        <h3>Hitung Diskon Belanja</h3>
        <input type="number" id="totalBelanja" placeholder="Masukkan Total Belanja (Rp)"><br>
        <button onclick="hitungDiskon()" style="background: #FF8AE0;">Hitung Diskon</button>

        <div style="margin-top: 15px; text-align: left; background: #f9f9f9; padding: 10px; border-radius: 5px; font-size: 14px;">
            <p>Diskon (10%): <b>Rp <span id="potonganDiskon">0</span></b></p>
            <p style="font-size: 18px; color: #27ae60;">Total Bayar: <b>Rp <span id="totalBayar">0</span></b></p>
        </div>
    </div>

    <script>
        function tambah() {
            let a = parseFloat(document.getElementById('angka1').value);
            let b = parseFloat(document.getElementById('angka2').value);
            document.getElementById('hasilAngka').innerHTML = a + b;
        }

        function kurang() {
            let a = parseFloat(document.getElementById('angka1').value);
            let b = parseFloat(document.getElementById('angka2').value);
            document.getElementById('hasilAngka').innerHTML = a - b;
        }

        function kali() {
            let a = parseFloat(document.getElementById('angka1').value);
            let b = parseFloat(document.getElementById('angka2').value);
            document.getElementById('hasilAngka').innerHTML = a * b;
        }

        function bagi() {
            let a = parseFloat(document.getElementById('angka1').value);
            let b = parseFloat(document.getElementById('angka2').value);
            if (b === 0){
                alert('Peringatan: Tidak bisa membagi angka dengan 0!');
                return
            }
            document.getElementById('hasilAngka').innerHTML = a / b;
        }

        function reset () {
            document.getElementById('angka1').value ="";
            document.getElementById('angka2').value ="";
            document.getElementById('hasilAngka').innerHTML ='0';
        }

        function hitungDiskon() {
            let total = parseFloat(document.getElementById('totalBelanja').value) || 0;
            let diskon = 0;

            if (total >= 100000) {
                diskon = total * 0.10;
            }

            let bayar = total - diskon;

            document.getElementById('potonganDiskon').innerText = diskon.toLocaleString('id-ID');
            document.getElementById('totalBayar').innerText = bayar.toLocaleString('id-ID');
        }
    </script>
</body>
</html>
