<!DOCTYPE html>
<html>

<head>
    <title>Konversi Suhu</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
            background: #f0f8ff;
        }

        .konversi {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            text-align: center;
        }

        input {
            padding: 10px;
            margin: 5px;
            font-size: 16px;
            width: 80%;
            box-sizing: border-box;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            font-size: 16px;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .btn-konversi {
            background: #F9E79F;
        }

        .btn-konversi:hover {
            background: #F7DC6F;
        }

        .hasil {
            font-size: 22px;
            font-weight: bold;
            color: #2c3e50;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="konversi">

        <h2>Konversi Suhu</h2>

        <input type="text" id="celcius" placeholder="Masukkan suhu Celcius">

        <br>

        <button class="btn-konversi" onclick="konversiSuhu()">Konversi</button>

        <div class="hasil">
            Fahrenheit: <span id="fahrenheit">-</span><br>
            Kelvin: <span id="kelvin">-</span>
        </div>

    </div>

    <script>

        function konversiSuhu() {

            let celcius = document.getElementById('celcius').value;

            if (celcius === "") {
                alert("Suhu tidak boleh kosong!");
                return;
            }

            if (isNaN(celcius)) {
                alert("Input harus berupa angka!");
                return;
            }

            celcius = parseFloat(celcius);

            let fahrenheit = (celcius * 9 / 5) + 32;
            let kelvin = celcius + 273.15;

            document.getElementById('fahrenheit').innerHTML = fahrenheit;
            document.getElementById('kelvin').innerHTML = kelvin;
        }

    </script>

</body>

</html>
